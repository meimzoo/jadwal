  <h2>Contact Us</h2>
  <h4>Have questions, feedback, or ideas for Jadwal?<br>
    Fill out the form below and we'll get back to you.</h4>

  <form action="contact.html" method="get">
    <table>

      <tr>
        <td>
          <label for="user_name">Name:</label>
        </td>
        <td>
          <input type="text" id="user_name" name="user_name" required>
        </td>
      </tr>

      <tr>
        <td>
          <label for="email">Email:</label>
        </td>
        <td>
          <input type="email" id="email" name="email" required>
        </td>
      </tr>

      <tr>
        <td>
          <label for="subject">Subject/Topic:</label>
        </td>
        <td>
          <select name="subject" id="subject" required>
            <option value="" disabled selected>Select</option>
            <option value="General Feedback">General Feedback</option>
            <option value="Feature Request">Feature Request</option>
            <option value="Bug Report">Bug Report</option>
            <option value="Partnership / Business Inquiry">Partnership / Business Inquiry</option>
          </select>
        </td>
      </tr>

      <tr>
        <td>
          <label for="comments">Comments:</label>
        </td>
        <td>
          <textarea id="comments" name="comments" rows="10" cols="30"></textarea>
        </td>
      </tr>

      <tr>
        <td></td>
        <td>
          <button id="submit" type="submit">Submit</button>
          <input type="reset" value="Reset">
        </td>
      </tr>


    </table>
  </form>
